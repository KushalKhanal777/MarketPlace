{% extends 'master/base.html' %}

{% block title %}Server Error - Islington Marketplace{% endblock %}

{% block content %}
<div class="error-page fade-in">
    <div class="error-code">500</div>
    <h2>Something Went Wrong</h2>
    <p>We're experiencing some technical difficulties. Our team has been notified and is working on a fix.</p>
    <div style="display: flex; gap: var(--sp-3); justify-content: center;">
        <a href="{% url 'home' %}" class="btn btn-primary"><i class="fas fa-house"></i> Go Home</a>
        <a href="javascript:location.reload()" class="btn btn-outline"><i class="fas fa-rotate-right"></i> Try Again</a>
    </div>
</div>
{% endblock %}
