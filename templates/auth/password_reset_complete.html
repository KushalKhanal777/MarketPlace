{% extends 'master/base.html' %}

{% block title %}Password Reset Complete - Islington Marketplace{% endblock %}

{% block content %}
<div class="auth-page fade-in">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <div class="auth-brand-icon" style="background: var(--success);"><i class="fas fa-check" style="font-size: 1.2rem;"></i></div>
            <h1>Password reset complete</h1>
            <p>Your password has been successfully reset. You can now sign in with your new password.</p>
        </div>

        <a href="{% url 'login' %}" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </a>
    </div>
</div>
{% endblock %}
