{% extends 'master/base.html' %}

{% block title %}Set New Password - Islington Marketplace{% endblock %}

{% block content %}
<div class="auth-page fade-in">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon"><i class="fas fa-key" style="font-size: 1.2rem;"></i></div>
            <h1>Set new password</h1>
            <p>Enter your new password below</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_new_password1">New Password</label>
                <div class="password-wrapper">
                    <input type="password" name="new_password1" id="id_new_password1" class="form-input" placeholder="Enter new password" required autofocus>
                    <button type="button" class="password-toggle" onclick="togglePassword('id_new_password1', this)" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_new_password2">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" name="new_password2" id="id_new_password2" class="form-input" placeholder="Confirm new password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('id_new_password2', this)" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(inputId, btn) {
    var input = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { input.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
{% endblock %}
